services:

  postgres:

    image: postgres:17

    container_name: notes-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: psql123
      POSTGRES_DB: notesdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  backend:

    build:
      context: ./backend

    container_name: notes-backend

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

    restart: unless-stopped


  nginx:

    build:
      context: .
      dockerfile: nginx/Dockerfile

    container_name: notes-nginx

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  postgres_data: