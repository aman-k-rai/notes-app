<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notes Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <h2>Notes</h2>

        </aside>

        <main class="main-content">

            <div class="top-bar">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search notes..."
                    onkeyup="filterNotes()"
                >

            </div>

            <div class="create-note">

                <textarea
                    id="noteInput"
                    placeholder="Write a new note..."
                ></textarea>

                <button
                    id="actionButton"
                    class="action-btn"
                    onclick="addNote()"
                >
                    Add Note
                </button>

            </div>

            <div
                id="notesContainer"
                class="notes-grid"
            >
            </div>

        </main>

    </div>

    <script src="js/main.js"></script>

</body>

</html>
